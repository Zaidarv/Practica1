<!DOCTYPE html> 
<html lang="en"> 

<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
</head>

<body> 

    <table style="border: 1px solid;"> 

       <tr> 
        <th style="border: 1px solid black;">Company</th> <!-- Coloca contenido y da borde con color -->
        <th>Country</th>
        <th>Contact</th>
       </tr>

       <tr> 
        <td>Company1</td>
        <td>Company2</td>
        <td>Company3</td>
       </tr>

       <tr> 
        <td>Contact1</td>
        <td>Contact2</td>
        <td>Contact3</td>
       </tr>

    </table> 

    <br> 

    <form> <!-- Inicio del formulario -->

        <label for="nombre">Nombre: </label>
        <!-- Identifica el campo que debe llenar el usuario -->

        <input type="text" id="nombre" name="nombre" placeholder="Nombre"/>
        <!-- type: tipo de dato a introducir,
        id: identificador del campo,
        name: nombre del campo,
        placeholder: texto de ayuda que aparece dentro del campo -->

        <!-- type: tipo de dato a introducir,
        text: texto,
        password: contraseña,
        radio: selección de una opción,
        checkbox: selección de varias opciones,
        file: selección de un archivo,
        submit: botón para enviar el formulario -->
        
    </form> <!-- Fin del formulario -->

</body>

</html>
